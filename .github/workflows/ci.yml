name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_WITHOUT: 'gtk:vscode:profanity'

jobs:
  # Shared lint + test from elanthia-online/.github, pinned by full SHA.
  ruby:
    uses: elanthia-online/.github/.github/workflows/ruby-ci.yml@277eba54e8b75c7e235e459ea53076f6151a4db0
    with:
      lint-scope: repo

  yard:
    name: yard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      # Parses every file listed in .yardopts and renders the HTML (private
      # methods included) so that parse-time warnings (unknown tags, @param
      # names that don't match the signature, ...) and render-time warnings
      # (unresolvable {Links}) are all reported. Any warning fails the job.
      - name: YARD warnings
        run: bundle exec yard doc --private --fail-on-warning --no-save --no-stats --output-dir "$RUNNER_TEMP/yard"

      # Every module, class, constant, method and attribute, private
      # methods included, must have a docstring.
      - name: Undocumented objects
        shell: bash
        run: |
          bundle exec yard stats --private --list-undoc --no-save | tee "$RUNNER_TEMP/yard-stats.txt"
          if grep -q '^Undocumented Objects:' "$RUNNER_TEMP/yard-stats.txt"; then
            echo "::error::Add a YARD docstring to each undocumented object listed above."
            exit 1
          fi

      # The checker's self-test: it must still report each kind of gap in
      # its fixture (missing or stale @param, missing @return, yield without
      # @yield, raise without @raise, ...) and nothing else, print each gap
      # as file:line, and exit 1 when there is a gap (0 when there is none).
      - name: YARD tag checker self-test
        run: bundle exec ruby script/check_yard_tags.rb --self-test

      # Every method's tags must match its code: a @param for each
      # parameter and none for a parameter it doesn't have, a @return, a
      # @yield if it yields, a @raise if it raises, and typed tags. A
      # constant, class or module may not carry method tags, except a
      # typed @return on a constant (YARD shows it as the constant's type).
      # Each gap is listed as file:line.
      - name: YARD tags match the code
        run: bundle exec ruby script/check_yard_tags.rb

  ci-gate:
    name: ci-gate
    if: always()
    needs: [ruby, yard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
