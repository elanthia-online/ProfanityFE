name: Rubocop
on: 
  push:
    branches:
      - main
    paths:
      - "**/*.rb"
      - "*.rb"
  pull_request:
    paths:
      - "**/*.rb"
      - "*.rb"
jobs:
  rubocop:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: 'gtk:vscode:profanity'
    name: Run Rubocop on Ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
      
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Rubocop
        run: |
          bundle exec rubocop
