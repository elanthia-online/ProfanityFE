name: YARD Docs
on:
  push:
    branches:
      - main
    paths:
      - "**/*.rb"
      - "*.rb"
      - ".yardopts"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/yard_docs.yaml"
  pull_request:
    paths:
      - "**/*.rb"
      - "*.rb"
      - ".yardopts"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/yard_docs.yaml"

jobs:
  yard:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: 'gtk:vscode:profanity'
    name: Check YARD documentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      # Parses every file listed in .yardopts and renders the HTML (private
      # methods included) so that parse-time warnings (unknown tags, @param
      # names that don't match the signature, ...) and render-time warnings
      # (unresolvable {Links}) are all reported. Any warning fails the job.
      - name: YARD warnings
        run: bundle exec yard doc --private --fail-on-warning --no-save --no-stats --output-dir "$RUNNER_TEMP/yard"

      # Every public module, class, constant, method and attribute must have
      # a docstring. Private methods are not checked (yet).
      - name: Undocumented public objects
        shell: bash
        run: |
          bundle exec yard stats --list-undoc --no-save | tee "$RUNNER_TEMP/yard-stats.txt"
          if grep -q '^Undocumented Objects:' "$RUNNER_TEMP/yard-stats.txt"; then
            echo "::error::Add a YARD docstring to each undocumented object listed above."
            exit 1
          fi
